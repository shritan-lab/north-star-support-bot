<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Star Support Bot</title>
<meta name="description" content="Offline customer support bot for North Star Outfitters. Order tracking, returns, gear recommendations, and live agent handoff.">
<!-- Favicon is an inline SVG data URI so the browser never requests /favicon.ico.
     The colon in the SVG namespace is percent encoded, which is standard URI encoding. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230F1E24'/%3E%3Cpath%20d='M16%204%20L18.4%2013.6%20L28%2016%20L18.4%2018.4%20L16%2028%20L13.6%2018.4%20L4%2016%20L13.6%2013.6%20Z'%20fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
/* ============================================================
   THEME TOKENS
   Night sky navigation and alpine dusk. Amber is used in exactly
   two places: the live agent state and keyboard focus rings.
   ============================================================ */
:root{
  --bg-deep:#0B141A;    /* near-black pine, base of the page */
  --bg-glow-a:#2B3A45;  /* slate blue-grey, mid gradient */
  --bg-glow-b:#C97B3D;  /* warm amber, horizon glow, background only */
  --panel:#FAF8F4;      /* warm bone, the chat card */
  --panel-alt:#F1EDE4;  /* a touch darker, bot bubbles and chips */
  --ink:#14201F;        /* primary text */
  --user:#1F3D46;       /* slate teal */
  --accent:#E8A33D;     /* headlamp amber, live agent state and focus only */
  --line:#E2DCCB;       /* warm hairline */
  --muted:#606F75;      /* timestamps and system text, 4.9:1 on the panel */
  --stack: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:14px;
}

*{box-sizing:border-box}
html,body{height:100%}

/* Alpine dusk, drawn entirely in layered CSS gradients: a warm horizon glow low
   in the frame over deep pine and slate. It lives on the root so it always
   covers the full canvas, and never sits under any text. */
html{
  background:
    radial-gradient(140% 46% at 50% 72%, rgba(214,132,66,.60) 0%, rgba(201,123,61,.24) 38%, rgba(201,123,61,0) 66%),
    radial-gradient(70% 30% at 22% 70%, rgba(186,104,96,.26) 0%, rgba(186,104,96,0) 62%),
    radial-gradient(80% 34% at 82% 68%, rgba(232,163,61,.30) 0%, rgba(232,163,61,0) 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, #16242C 30%, var(--bg-glow-a) 56%, #45565C 70%, #22323A 86%, var(--bg-deep) 100%);
  background-attachment:fixed;
  background-repeat:no-repeat;
}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--stack);
  font-size:15px;
  font-weight:400;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  background:transparent;
}

.app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  margin:0 auto;
  overflow:hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 18px 40px -12px rgba(6,12,16,.55),
    0 40px 90px -30px rgba(6,12,16,.65);
}
@media (min-width:520px){
  body{align-items:center;padding:20px}
  .app{height:min(100dvh - 40px, 860px)}
}

/* one small arrival moment, nothing else animates */
@keyframes panelIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.app{animation:panelIn 300ms ease-out both}

/* ---------- header ---------- */
.hdr{
  flex:none;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-glow-a) 100%);
  color:var(--panel);
  transition:background 400ms ease, color 400ms ease;
}
.hdr.agent{
  background:linear-gradient(135deg, #D9902F 0%, var(--accent) 100%);
  color:var(--ink);
}
.mark{
  flex:none;
  width:38px;height:38px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);
  transition:background-color 400ms ease;
}
.hdr.agent .mark{background:rgba(15,30,36,.14)}
.mark svg{
  width:22px;height:22px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 6px rgba(232,163,61,.55));
}
.hdr.agent .mark svg{filter:drop-shadow(0 0 5px rgba(20,32,31,.30))}
.mark .glyph-person{display:none}
.hdr.agent .glyph-star{display:none}
.hdr.agent .glyph-person{display:block}
.hdr-text{min-width:0}
.hdr h1{
  margin:0;
  font-size:16.5px;
  font-weight:600;
  letter-spacing:-0.012em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hdr .status{margin:0;font-size:12px;letter-spacing:.02em;opacity:.8}
.dot{
  display:none;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--ink);
  margin-right:6px;
}
.hdr.agent .dot{display:inline-block}

/* ---------- transcript ---------- */
.transcript{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:18px 16px 8px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.row{display:flex;flex-direction:column;max-width:86%}
.row.bot{align-self:flex-start;align-items:flex-start}
.row.user{align-self:flex-end;align-items:flex-end}
.bubble{
  padding:10px 13px;
  border-radius:var(--radius);
  background:#EFEADF;                /* 3% below the panel, a distinct surface */
  border:1px solid #C6BCA4;          /* warm mid-tone, visible without weight */
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 1px 2px rgba(20,32,31,.06);
  overflow-wrap:anywhere;
}
/* sharp near the tail, round elsewhere */
.row.bot .bubble{border-bottom-left-radius:5px}
.row.user .bubble{
  background:var(--user);
  border-color:var(--user);
  color:#FFFFFF;
  border-bottom-right-radius:5px;
  box-shadow:0 1px 2px rgba(20,32,31,.18);
}
.bubble.from-agent{border-left:3px solid var(--accent)}
/* the first bot message sets the first impression */
.row.bot:first-child .bubble{font-size:16px}
.bubble p{margin:0}
.bubble p + p{margin-top:9px}
.bubble strong{font-weight:600}
.stamp{font-size:11px;color:var(--muted);margin:3px 4px 0}

/* system divider */
.sys{
  align-self:stretch;
  display:flex;align-items:center;gap:10px;
  margin:4px 0;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.sys::before,.sys::after{content:"";height:1px;flex:1;background:var(--line)}
.sys.hot::before,.sys.hot::after{background:var(--accent)}

/* typing indicator */
.typing{display:flex;gap:5px;padding:14px 13px}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:var(--muted);
  animation:pulse 1.1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.16s}
.typing span:nth-child(3){animation-delay:.32s}
@keyframes pulse{
  0%,60%,100%{opacity:.28;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-2px)}
}

/* ---------- quick replies ----------
   Two equal columns, so a group of four never wraps 3-then-1. Groups of one or
   three fill the row rather than leaving a ragged trailing item. */
.quick{
  flex:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:2px 16px 0;
}
.quick:empty{padding:0}
.quick.count-1{grid-template-columns:minmax(0,max-content)}
.quick.count-3 .chip:nth-child(3){grid-column:1 / -1}
.chip{
  font:inherit;font-size:13.5px;
  text-align:center;
  color:var(--ink);
  background:linear-gradient(180deg, #FFFDF9 0%, #EFEADF 100%);
  border:1px solid #978B6E;          /* 3.2:1 on the panel, reads as a control */
  border-radius:999px;
  padding:8px 13px;
  cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(20,32,31,.09);
  transition:transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}
.chip:hover{
  border-color:var(--user);
  transform:translateY(-1px);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 3px 8px rgba(20,32,31,.14);
}
.chip:active{
  transform:translateY(0);
  box-shadow:0 1px 3px rgba(20,32,31,.16) inset;
}
/* the state change reaches the chips too, not just the header */
.agent-mode .chip{
  border-color:rgba(232,163,61,.55);
  background:linear-gradient(180deg, #FDF4E5 0%, var(--panel-alt) 100%);
}
.agent-mode .chip:hover{border-color:var(--accent)}

/* ---------- composer ---------- */
.composer{
  flex:none;
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;
  margin-top:8px;
  border-top:1px solid var(--line);
}
.composer input{
  flex:1;min-width:0;
  font:inherit;
  padding:11px 14px;
  color:var(--ink);
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:999px;
  box-shadow:0 1px 3px rgba(20,32,31,.10) inset;
}
.composer input::placeholder{color:var(--muted)}
.send{
  flex:none;
  width:40px;height:40px;
  display:grid;place-items:center;
  border:0;border-radius:50%;
  background:linear-gradient(180deg, var(--accent) 0%, #D9902F 100%);
  color:#20160A;
  cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(201,123,61,.35);
}
.send svg{width:18px;height:18px;fill:currentColor;display:block}
.send[disabled]{opacity:.4;cursor:default;box-shadow:none}

/* ---------- footer and self test ---------- */
/* a quiet footnote, not a feature being advertised */
.foot{
  flex:none;
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 16px 10px;
  font-size:11px;
  color:var(--muted);
}
.linkbtn{
  font:inherit;font-size:11px;
  letter-spacing:.02em;
  color:var(--muted);
  background:none;border:0;padding:2px 0;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
}
.linkbtn:hover{color:var(--ink)}
/* a diagnostics drawer, deliberately quieter than the product above it */
.panel{
  flex:none;
  max-height:46vh;
  overflow-y:auto;
  padding:14px 16px 16px;
  background:var(--panel-alt);
  border-top:1px solid var(--line);
}
.panel h2{
  margin:0;
  font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);
}
.panel .summary{margin:4px 0 12px;font-size:15px;font-weight:600}
.cases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.case{
  display:flex;gap:9px;align-items:flex-start;
  padding:8px 10px;
  font-size:12.5px;line-height:1.45;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
}
.badge{
  flex:none;
  margin-top:1px;
  padding:2px 6px;
  font-size:10px;font-weight:600;letter-spacing:.06em;
  border-radius:4px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--muted);
}
.case.pass .badge{color:var(--user);border-color:var(--user)}
.case.fail{border-color:var(--ink)}
.case.fail .badge{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.case code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.case .meta{display:block;color:var(--muted);margin-top:2px}

/* ---------- focus ---------- */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.composer input:focus-visible{outline-offset:1px}

/* ---------- responsive ---------- */
@media (max-width:380px){
  body{font-size:14.5px}
  .transcript{padding:14px 12px 8px}
  .quick,.composer,.foot,.panel{padding-left:12px;padding-right:12px}
  .row{max-width:92%}
}

/* ---------- motion preference ---------- */
@media (prefers-reduced-motion: reduce){
  .hdr,.mark{transition:none}
  .typing span{animation:none;opacity:.5}
  .app{animation:none}
  .chip{transition:none}
  .chip:hover{transform:none}
}
</style>
</head>
<body>

<div class="app">

  <header class="hdr" id="hdr">
    <div class="mark" id="mark" aria-hidden="true">
      <svg class="glyph-star" viewBox="0 0 32 32"><path d="M16 4 L17.84 11.57 L24.49 7.51 L20.43 14.16 L28 16 L20.43 17.84 L24.49 24.49 L17.84 20.43 L16 28 L14.16 20.43 L7.51 24.49 L11.57 17.84 L4 16 L11.57 14.16 L7.51 7.51 L14.16 11.57 Z"/></svg>
      <svg class="glyph-person" viewBox="0 0 32 32"><circle cx="16" cy="11.5" r="4.8"/><path d="M6.6 27 a9.4 9.4 0 0 1 18.8 0 Z"/></svg>
    </div>
    <div class="hdr-text">
      <h1 id="hdrTitle">North Star Support Bot</h1>
      <p class="status" id="hdrStatus"><span class="dot" aria-hidden="true"></span><span id="hdrStatusText">Automated support</span></p>
    </div>
  </header>

  <main class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Conversation with North Star support"></main>

  <div class="quick" id="quick" aria-label="Quick replies"></div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Type a message" aria-label="Type your message" autocomplete="off">
    <button class="send" id="send" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.4 21.6 22 12 2.4 2.4 2.4 9.9 16 12 2.4 14.1 Z"/>
        <path d="M2.4 21.6 22 12 9.6 12 Z" opacity=".45"/>
      </svg>
    </button>
  </form>

  <div class="foot">
    <button class="linkbtn" id="selftestToggle" type="button" aria-expanded="false" aria-controls="panel">Diagnostics</button>
  </div>

  <section class="panel" id="panel" aria-label="Self-test results" hidden>
    <h2>Self-test</h2>
    <p class="summary" id="summary"></p>
    <ol class="cases" id="cases"></ol>
  </section>

</div>

<script>
(function(){
'use strict';

/* ============================================================
   1. CONTENT
   Every user facing string and every piece of business data
   lives here so it can be checked against the brief in one pass.
   Nothing outside this block invents a fact.
   ============================================================ */

var COPY = {
  greeting:
    "Hi, I'm the North Star Support Bot. I can track an order, help with returns or exchanges, recommend gear, or connect you with a live agent.",

  greetingIntent: "Hey. What can I help you with?",

  askOrder: "Happy to help. What's your order number?",

  order111:
    "Order #111 has shipped and it's arriving tomorrow.\n\n" +
    "Anything else?",

  order222:
    "Order #222 is processing and ships within 24 hours. Once it's on the way, standard shipping takes 3 to 5 business days.\n\n" +
    "Anything else?",

  order333: "Order #333 was delivered. Did everything arrive in good shape?",

  followUpYes:
    "Glad to hear it. Enjoy the trail.\n\n" +
    "Anything else?",

  followUpNo:
    "Sorry about that. Our return window is 30 days from delivery, and items need to be unused and in their original packaging. " +
    "You can start a return here: northstaroutfitters.com/returns\n\n" +
    "If you'd rather sort it out with a person, I can connect you with a live agent.",

  /* Never lists which order numbers exist. A support bot reciting the valid
     numbers is a privacy failure. The demo numbers live in the footer instead,
     as product chrome for the reviewer rather than bot speech to a customer. */
  invalidOrderFirst:
    "I couldn't find an order with that number. Give it another check, or I can connect you with a live agent to look it up.",

  /* One escalation message for every way of being stuck. Three misses of any
     kind, in any bot-controlled state, in any combination. */
  stuckEscalation:
    "I want to make sure you get sorted out. Let me connect you with a live agent.",

  /* "I don't know" in the order flow is a real answer to acknowledge, but it is
     still a miss: it moves the lookup no closer to resolving. */
  orderNumberUnknown:
    "No worries. If you can't find it, I can pull it up on the agent side instead.",

  returns:
    "Returns and exchanges at North Star:\n\n" +
    "You have 30 days to return an item. It needs to be unused and in its original packaging.\n\n" +
    "Exchanges use the same process, so start here either way: northstaroutfitters.com/returns\n\n" +
    "Anything else?",

  shipping:
    "Standard shipping takes 3 to 5 business days. Expedited shipping takes 1 to 2 business days.\n\n" +
    "Anything else?",

  menuReset:
    "Back to the main menu. I can track an order, help with returns and exchanges, recommend gear, or connect you with a live agent.",

  orderNumberPrompt:
    "I'll need your order number to look that up. You can also type menu to go back.",

  /* Answers to the bot's own closing question, "Anything else?" */
  closingDone: "Happy to help. Have a good one out there.",
  closingMore: "What can I help you with?",
  courtesyThanks: "Anytime. Anything else I can help with?",

  identityBot:
    "I'm the North Star Support Bot. I can track an order, help with returns and exchanges, recommend gear, or connect you with a live agent.",

  /* Pricing, stock and carriers were never provided, so they are declined by
     name rather than answered, guessed at, or quietly redirected. */
  unavailable:
    "I don't have pricing, stock or carrier details here. I can help with order tracking, returns and exchanges, or gear recommendations, or I can connect you with a live agent.",

  /* Cancelling or editing an order is not something this bot can do. Say so,
     rather than asking for an order number and implying it can. */
  unsupportedAction:
    "I can't change an order from here. I can look up its status, go over returns and exchanges, or connect you with a live agent.",

  /* The brief provides the returns link and nothing else, so nothing else is offered. */
  contact:
    "I don't have a general site link to share here. For returns and exchanges you can go to northstaroutfitters.com/returns",

  /* The category description comes from the brief, so it is provided data. */
  catalogIntro: "We carry outdoor apparel and camping gear.",

  recQ1: "Let's find the right gear. What are you heading out for?",

  recQ2: "Good pick. What conditions are you expecting?",

  /* Rotated in order, so four recommendations in a row do not read as four
     copies of the same sentence with the nouns swapped. */
  recTemplates: [
    "For {activity} in {conditions} conditions, start with **{primary}**. Worth adding: {secondary}.",
    "Heading out {activity} in {conditions} conditions, I'd start with **{primary}**. Worth adding: {secondary}.",
    "For {conditions} conditions, **{primary}** is where I'd start. Worth adding: {secondary}."
  ],

  /* Asked a specific question, an unrecognized answer re-asks that question
     rather than dumping the user back at the main menu. */
  recReprompt: "Sorry, I didn't understand that. Which of these is closest?",
  followUpReprompt: "Sorry, I didn't understand that. Did everything arrive in good shape?",
  recCancel: "No problem. What else can I help you with?",

  agentConnecting: "Connecting you with a live agent now.",
  agentDivider: "Live Agent connected",
  agentIntro:
    "Hi, this is Riley from the North Star team. I've got your full conversation history, so what can I help with?",
  /* Riley prefixes a lookup with one of these, so the facts stay identical to
     the bot's while the voice does not repeat. Rotated in order. Direct answers
     (courtesy, identity, contact, what-are-you) take no prefix at all. */
  agentPrefixes: [
    "Sure, I can pull that up.",
    "Let me check that for you.",
    "Of course, here you go."
  ],

  /* Riley never opens a multi-turn flow he cannot finish. He hands it back. */
  agentHandback:
    "Let me hand you back to the support bot, it'll walk you through it.",

  agentAlready:
    "You're already connected with me, Riley. Go ahead.",

  identityAgent: "I'm Riley, part of the North Star support team.",

  /* Rotated in order so the same one never lands twice in a row. These replace
     the old case-notes phrasing: a question must never be answered by telling
     the user their question has been filed. Each one offers a real next step. */
  agentAcks: [
    "I don't have that detail on hand. I can look up an order, go over returns and exchanges, or hand you back to the support bot for gear recommendations.",
    "That one's outside what I can pull up here. I can help with an order lookup, returns and exchanges, or gear recommendations through the support bot.",
    "I'm not able to answer that one. What I can do is check an order, explain returns and exchanges, or get you gear recommendations."
  ],

  agentCapability:
    "I can look up an order, go over returns and exchanges, or hand you back to the support bot for gear recommendations.",

  agentGreeting: "Hi again. What can I help with?",

  /* "order" is both a noun and a verb. When the sense is genuinely unclear,
     ask instead of guessing and demanding a number they may not have. */
  orderSenseQuestion:
    "Happy to help. Are you looking up an existing order, or looking to buy something?",

  /* The brief is outdoor apparel and camping gear. Say so rather than forcing an
     unrelated activity into one of the four categories. */
  recOutOfScope:
    "That one's a bit outside what we carry, we're focused on outdoor apparel and camping gear. Want me to point you toward something in that range instead?",

  /* Not knowing is a normal answer to a recommendation question. */
  recUnsureQ1: "No problem. Here's what most people start with, pick whichever is closest.",
  recUnsureQ2: "No problem. What's the weather usually like when you head out?",

  agentFollowUpYes: "Glad to hear it. Anything else I can help with?",

  /* Negation: the user asked for something not to happen. */
  negatedAgent:
    "Understood, I'll keep you here with the support bot. What can I help you with?",
  negatedOther: "No problem. What would you like to do instead?",

  frustration: "Sorry, I'm not making this easy. Let me get you to a live agent.",

  agentIdentity:
    "Fair question. This is a simulated live agent state for this demo, so I'm scripted rather than a real person. In production this is where a human agent picks up with the full conversation history.",

  agentTiming:
    "I don't have a specific time to give you on that, and I don't want to guess. Your conversation is logged, so whoever picks it up will have the full context.",

  agentClosing:
    "Happy to help. Your conversation stays logged, and you can head back to the main menu any time.",

  agentUnknownOrder:
    "I'm not finding an order with that number on my end. Can you double check it?",

  agentExitDivider: "Back with the support bot",
  agentExit: "You're back with the North Star Support Bot. What can I help you with?",

  fallbackFirst:
    "Sorry, I didn't understand that. I can help with order tracking, returns and exchanges, product recommendations, or I can connect you with a live agent.",


  switchAck: "Sure, let's switch gears."
};

/* Quick reply sets. Labels are the exact text sent when a chip is clicked. */
var QUICK = {
  none: [],
  menu: ['Track my order', 'Returns and exchanges', 'Help me find gear', 'Talk to a live agent'],
  orderHelp: ['Talk to a live agent', 'Back to main menu'],
  invalidOrder: ['Try again', 'Talk to a live agent', 'Back to main menu'],
  delivered: ['Yes, all good', 'I need to return something', 'Talk to a live agent'],

/* Fills the next result template. {activity} and {conditions} take the `phrase`
   forms above, {primary} and {secondary} come from REC_MATRIX. The template
   rotates so it never repeats twice in a row. */
function recResultText(session, activityId, conditionId){
  var a = optionById(REC_ACTIVITIES, activityId);
  var c = optionById(REC_CONDITIONS, conditionId);
  var pair = REC_MATRIX[a.id][c.id];

  session.recTemplateIndex = (session.recTemplateIndex + 1) % COPY.recTemplates.length;

  var body = COPY.recTemplates[session.recTemplateIndex]
    .replace('{activity}', a.phrase)
    .replace('{conditions}', c.phrase)
    .replace('{primary}', lowerFirst(pair[0]))
    .replace('{secondary}', pair[1]);

  return body + '\n\nWant me to help with anything else?';
}

  'when will you reply','how soon','how long until','when can i expect','when do i hear back',
  'how long do i wait'
];

/* ============================================================
   3. MATCHER
   Normalize, then score. Highest total weight wins. Ties break
   on the longest matched pattern, then on declaration order.
   ============================================================ */

function normalize(text){
  return String(text)
    .toLowerCase()
    .replace(/[^a-z0-9#\s]+/g, '')  /* strip punctuation, keep # */
    .replace(/\s+/g, ' ')
    .replace(/^ | $/g, '');
}

/* Symbols that never appear in genuine customer language: a reliable signal of
   placeholder text or injected syntax, like "<abc>" typed where an order number
   belongs. Checked on the raw message, before punctuation stripping, so a junk
   token is caught even though it never survives normalize. */
var JUNK_TOKEN_CHARS = /[<>{}\[\]|~`]/;
function hasJunkToken(raw){
  var tokens = String(raw).split(/\s+/);
  for(var i = 0; i < tokens.length; i++){
    if(JUNK_TOKEN_CHARS.test(tokens[i])){ return true; }
  }
  return false;
}

/* A closed, explicit list of words that are only ever meaningless test or
   placeholder filler, never a genuine reference to a physical order. This is
   not a vagueness filter: "stuff", "package", "thing" and even profanity are
   all things a real customer might plausibly type and must keep routing to
   AWAIT_ORDER as they always have. The distinction is "is this word ever
   anything other than a placeholder", not "is this a real word".
   Kept alongside the structural rule below, not replaced by it: every word
   here is a real short string (qwerty, test, sample) or under the structural
   rule's 4-letter floor (abc, xyz, foo, bar), so none of them is actually
   caught by vowel/run structure alone. */
var ORDER_PLACEHOLDER_OBJECTS = [
  'abc', 'xyz', 'asdf', 'foo', 'bar', 'lorem', 'qwerty', 'foobar',
  'test', 'testing', 'sample', 'placeholder'
];
var ORDER_PLACEHOLDER_TRIGGERS = [
  'where is my', 'wheres my', 'track my', 'tracking my', 'check my', 'checking my'
];

/* Structural gibberish test for the single trailing word of an order-tracking
   phrase. Letters only, 4 or more of them: flagged if it has no vowel at all,
   or a run of 5 or more consecutive consonants. Words under 4 letters are
   never judged this way, too short to tell either way. This catches
   keyboard-mash the explicit list above was never going to anticipate, but
   it cannot catch every case: a mash with one vowel breaking up the run, like
   "kjwef", reads structurally the same as a real word with one embedded
   vowel and a 3-consonant cluster, like "purchase", so it is left alone. */
var VOWELS = 'aeiou';
var GIBBERISH_MIN_LENGTH = 4;
var GIBBERISH_CONSONANT_RUN = 5;
function isStructurallyGibberish(word){
  if(word.length < GIBBERISH_MIN_LENGTH){ return false; }
  var vowelCount = 0;
  var run = 0;
  var maxRun = 0;
  for(var i = 0; i < word.length; i++){
    if(VOWELS.indexOf(word[i]) !== -1){
      vowelCount++;
      run = 0;
    } else {
      run++;
      if(run > maxRun){ maxRun = run; }
    }
  }
  return vowelCount === 0 || maxRun >= GIBBERISH_CONSONANT_RUN;
}

/* True only when the entire normalized message is one of the order-tracking
   trigger phrases above followed by nothing but a single trailing word that
   is either on the explicit placeholder list or structurally gibberish, the
   same shape as "where is my <abc>". A real object after the trigger,
   however crude or vague, leaves this false and the message routes exactly
   as it always has. Digits are untouched: a token that is not purely
   alphabetic (an order number, "order#") is never evaluated here at all. */
function isOrderTrackingPlaceholder(norm){
  for(var i = 0; i < ORDER_PLACEHOLDER_TRIGGERS.length; i++){
    var trigger = ORDER_PLACEHOLDER_TRIGGERS[i];
    if(norm.indexOf(trigger) === 0){
      var rest = norm.slice(trigger.length).replace(/^\s+/, '');
      if(!/^[a-z]+$/.test(rest)){ continue; }
      if(ORDER_PLACEHOLDER_OBJECTS.indexOf(rest) !== -1){ return true; }
      if(isStructurallyGibberish(rest)){ return true; }
    }
  }
  return false;
}

/* Token indexes that begin a new clause, derived from the raw text before
   punctuation is stripped. A negation must not reach past one of these:
   "i dont like it, want to return" is "not X, but Y", never "not Y".
   Walks the input the same way normalize does, so the indexes line up. */
var CLAUSE_PUNCTUATION = ',;.!?:';
function clauseBreaks(raw){
  var lower = String(raw).toLowerCase();
  var stripped = '';
  var breakAtOffset = {};
  var sawBreak = false;
  for(var i = 0; i < lower.length; i++){
    var ch = lower.charAt(i);
    if(/[a-z0-9#]/.test(ch)){
      if(sawBreak){ breakAtOffset[stripped.length] = true; sawBreak = false; }
      stripped += ch;
    } else if(/\s/.test(ch)){
      stripped += ' ';
    } else if(CLAUSE_PUNCTUATION.indexOf(ch) !== -1){
      sawBreak = true;   /* dropped from the text, exactly like normalize */
    }
  }
  var breaks = {};
  var re = /[^\s]+/g;
  var m;
  var index = 0;
  while((m = re.exec(stripped)) !== null){
    if(breakAtOffset[m.index]){ breaks[index] = true; }
    index += 1;
  }
  return breaks;
}

/* A second form with plural s stripped from tokens of four or more characters,
   so "gears" reaches "gear" and "orders" reaches "order". Both forms are scored
   and the higher one wins, so stemming can only ever add a match, never remove
   one. The four character floor keeps "yes", "has" and "was" intact. */
function stem(norm){
  return norm.split(' ').map(function(t){
    return (t.length >= 4 && t.charAt(t.length - 1) === 's') ? t.slice(0, -1) : t;
  }).join(' ');
}

function buildPattern(raw, weight, maxTokens){
  var text = normalize(raw);
  return { text: text, weight: weight, words: text.split(' ').length, maxTokens: maxTokens || 0 };
}

var INTENTS = INTENT_SOURCE.map(function(src){
  var patterns = [];
  var seen = {};
  var i;
  function add(raw, weight, cap){
    var p = buildPattern(raw, weight, cap);
    if(seen[p.text]){ return; }   /* a duplicate would silently double its weight */
    seen[p.text] = true;
    patterns.push(p);
  }
  for(i = 0; i < src.phrases.length; i++){ add(src.phrases[i], src.phraseWeight, src.maxTokens); }
  for(i = 0; i < src.keywords.length; i++){ add(src.keywords[i], src.keywordWeight, src.maxTokens); }
  if(src.low){
    for(i = 0; i < src.low.length; i++){ add(src.low[i], 1, src.lowMaxTokens || src.maxTokens); }
  }
  return { name: src.name, patterns: patterns };
});

function buildList(raw){ return raw.map(function(p){ return buildPattern(p, 1); }); }

var DENY = buildList(DENY_PATTERNS);
var AFFIRM = buildList(AFFIRM_PATTERNS);
var CLOSING_DENY = buildList(CLOSING_DENY_PATTERNS);
var CLOSING_AFFIRM = buildList(CLOSING_AFFIRM_PATTERNS);
var AGENT_IDENTITY = buildList(AGENT_IDENTITY_PATTERNS);
var AGENT_TIMING = buildList(AGENT_TIMING_PATTERNS);
var COURTESY_CLOSE = buildList(['bye','goodbye','see ya','later','thats it','that is it','done','take care','catch you later','have a good one']);
var CATALOG = buildList(CATALOG_PHRASES);
var NEVERMIND = buildList(NEVERMIND_PATTERNS);
var RETURN_TO_BOT = buildList(RETURN_TO_BOT_PATTERNS);
var FRUSTRATION = buildList(FRUSTRATION_PATTERNS);
var REC_CANCEL = buildList(REC_CANCEL_PATTERNS);
var TRANSFER_REQUEST = buildList(TRANSFER_VERBS);
var MOVEMENT = buildList(MOVEMENT_MARKERS);
var REC_UNSURE = buildList(REC_UNSURE_PATTERNS);
var REC_OUT_OF_SCOPE = buildList(REC_OUT_OF_SCOPE_PATTERNS);
var ORDER_UNSURE = buildList(ORDER_UNSURE_PATTERNS);
var FOLLOWUP_RETURN = buildList(FOLLOWUP_RETURN_PATTERNS);
var PURCHASE_PHRASE_LIST = buildList(PURCHASE_PHRASES);
var LOOKUP_PHRASE_LIST = buildList(LOOKUP_PHRASES);

/* Which sense of "order" the message means: 'purchase', 'lookup', 'ask', or
   null when the question does not arise. A marker before the word only settles
   it when there is an object after it, so a bare "i want to order" is asked
   about rather than guessed at. */
function orderSense(norm){
  var tokens = norm.split(' ');
  var i, j;

  var hasPurchaseWord = false;
  for(i = 0; i < PURCHASE_WORDS.length; i++){
    if(tokens.indexOf(PURCHASE_WORDS[i]) !== -1){ hasPurchaseWord = true; break; }
  }

  var orderIdx = -1;
  for(i = 0; i < tokens.length; i++){
    if(ORDER_WORDS.indexOf(tokens[i]) !== -1){ orderIdx = i; break; }
  }

  if(orderIdx === -1 && !hasPurchaseWord){ return null; }
  if(hasPurchaseWord){ return 'purchase'; }
  if(matchList(norm, PURCHASE_PHRASE_LIST)){ return 'purchase'; }

  /* A number in the message settles it: you cannot buy an order number. */
  if(/\d/.test(norm)){ return 'lookup'; }

  /* an intent-to-act marker just before the word, with an object after it */
  var markerBefore = false;
  for(i = 0; i < PURCHASE_MARKERS.length; i++){
    var marker = PURCHASE_MARKERS[i].split(' ');
    for(j = Math.max(0, orderIdx - NEGATION_WINDOW); j < orderIdx; j++){
      var hit = true;
      for(var k = 0; k < marker.length; k++){ if(tokens[j + k] !== marker[k]){ hit = false; break; } }
      if(hit && j + marker.length <= orderIdx){ markerBefore = true; break; }
    }
    if(markerBefore){ break; }
  }
  if(markerBefore && orderIdx < tokens.length - 1){ return 'purchase'; }

  if(matchList(norm, LOOKUP_PHRASE_LIST)){ return 'lookup'; }

  /* An order word with nothing to settle it either way. Ask rather than guess:
     "how do i order" and "can i order online" are not order-number requests. */
  return 'ask';
}

/* A known order number sitting anywhere in the message, as a whole token. */
function standaloneOrderToken(norm){
  var tokens = norm.split(' ');
  for(var i = 0; i < tokens.length; i++){
    var t = tokens[i].charAt(0) === '#' ? tokens[i].slice(1) : tokens[i];
    if(Object.prototype.hasOwnProperty.call(ORDERS, t)){ return t; }
  }
  return null;
}

function patternHits(pattern, norm, tokens){
  if(pattern.words > 1){ return norm.indexOf(pattern.text) !== -1; }
  return tokens.indexOf(pattern.text) !== -1;
}

function matchListOne(norm, list){
  var tokens = norm.split(' ');
  for(var i = 0; i < list.length; i++){
    if(patternHits(list[i], norm, tokens)){ return true; }
  }
  return false;
}

function matchList(norm, list){
  return matchListOne(norm, list) || matchListOne(stem(norm), list);
}

/* Yes and no only count as answers in a short reply. "no" is an answer,
   "no i already told you that number was wrong" is a sentence. */
function matchShortList(norm, list){
  if(norm.split(' ').length > SHORT_ANSWER_TOKENS){ return false; }
  return matchList(norm, list);
}

/* ---- typo tolerance ----
   Scoped tightly: a fixed word list, one substitution per message, and only
   consulted when exact and stemmed matching have both found nothing, so an
   exact match can never lose to a guess. */
var FUZZY_WORDS = [
  'order','orders','return','returns','exchange','exchanges','shipping','tracking','track',
  'package','agent','human','refund','cancel','policy','deliver','delivery','product',
  'products','jacket','camping','hiking','understand'
];
var FUZZY_MIN_LEN = 4;

/* Real words that happen to sit one edit from a target. Without this, "are you
   hiring" becomes "are you hiking" and lands in the gear flow. */
var FUZZY_BLOCKLIST = [
  'hiring','firing','wiring','hiding','biking','liking','older','police','policies',
  'cancer','truck','trucks','trace','trick','skipping','trucking','capping','carping',
  'jacked','racket','packet','borders','packed','ranking','banking'
];

/* True when one edit apart: substitution, insertion, deletion, or a swap of two
   neighbours. The swap case is what catches "retrun" and "poilcy". */
function withinOneEdit(a, b){
  if(a === b){ return true; }
  var la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1){ return false; }

  if(la === lb){
    var diffs = [];
    for(var i = 0; i < la; i++){
      if(a.charAt(i) !== b.charAt(i)){
        diffs.push(i);
        if(diffs.length > 2){ return false; }
      }
    }
    if(diffs.length === 1){ return true; }
    return diffs.length === 2 && diffs[1] === diffs[0] + 1 &&
           a.charAt(diffs[0]) === b.charAt(diffs[1]) && a.charAt(diffs[1]) === b.charAt(diffs[0]);
  }

  var shortWord = la < lb ? a : b;
  var longWord = la < lb ? b : a;
  var si = 0, li = 0, skipped = false;
  while(si < shortWord.length && li < longWord.length){
    if(shortWord.charAt(si) === longWord.charAt(li)){ si++; li++; continue; }
    if(skipped){ return false; }
    skipped = true;
    li++;
  }
  return true;
}

/* One corrected form of the message, or null if nothing needed correcting. */
function fuzzyForm(norm){
  var tokens = norm.split(' ');
  for(var i = 0; i < tokens.length; i++){
    var t = tokens[i];
    if(t.length < FUZZY_MIN_LEN){ continue; }
    if(FUZZY_WORDS.indexOf(t) !== -1){ continue; }
    if(FUZZY_BLOCKLIST.indexOf(t) !== -1){ continue; }
    for(var j = 0; j < FUZZY_WORDS.length; j++){
      if(withinOneEdit(t, FUZZY_WORDS[j])){
        var out = tokens.slice();
        out[i] = FUZZY_WORDS[j];
        return out.join(' ');   /* one substitution per message, then stop */
      }
    }
  }
  return null;
}

/* Token start offsets, so a substring match can be located by token index. */
function tokenOffsets(tokens){
  var starts = [];
  var pos = 0;
  for(var i = 0; i < tokens.length; i++){ starts.push(pos); pos += tokens[i].length + 1; }
  return starts;
}

function tokenIndexAt(starts, charIndex){
  for(var i = starts.length - 1; i >= 0; i--){ if(starts[i] <= charIndex){ return i; } }
  return 0;
}

/* Where a pattern begins, as a token index, or -1 if it does not match. */
function patternIndex(pattern, norm, tokens, starts){
  if(pattern.words > 1){
    var at = norm.indexOf(pattern.text);
    return at === -1 ? -1 : tokenIndexAt(starts, at);
  }
  return tokens.indexOf(pattern.text);
}

function negationIndexes(tokens){
  var out = [];
  for(var i = 0; i < tokens.length; i++){
    var t = tokens[i];
    if(NEGATION_TOKENS.indexOf(t) === -1){ continue; }
    /* bare "no" and "not" only count in a message long enough to be a sentence */
    if(WEAK_NEGATION_TOKENS.indexOf(t) !== -1 && tokens.length <= NEGATION_WINDOW){ continue; }
    /* and not when they open an "I don't know" idiom */
    if(NEGATION_EXCEPTIONS.indexOf(t + ' ' + (tokens[i + 1] || '')) !== -1){ continue; }
    out.push(i);
  }
  return out;
}

/* How far forward a negation at `from` reaches: to the pivot marker if there is
   one, otherwise a few tokens, capped so one "dont" cannot negate a paragraph. */
function negationReach(tokens, from, breaks){
  var limit = Math.min(tokens.length, from + 1 + NEGATION_MAX_REACH);
  for(var i = from + 1; i < limit; i++){
    if(breaks && breaks[i]){ return i; }   /* a new clause, so the negation ends here */
    for(var m = 0; m < NEGATION_STOP_MARKERS.length; m++){
      var marker = NEGATION_STOP_MARKERS[m].split(' ');
      var hit = true;
      for(var j = 0; j < marker.length; j++){ if(tokens[i + j] !== marker[j]){ hit = false; break; } }
      if(hit){ return i; }
    }
  }
  return limit;
}

function isNegated(negIdx, matchIdx, tokens, breaks){
  for(var i = 0; i < negIdx.length; i++){
    var from = negIdx[i];
    if(matchIdx <= from){ continue; }             /* the match starts at or before the marker */
    if(matchIdx < negationReach(tokens, from, breaks)){ return true; }
  }
  return false;
}

/* Scores one normalized form. Returns the winner plus any intent that only
   failed because the user negated it, so the caller can respond to the negation
   rather than silently doing nothing. */
/* Clause boundaries for the turn in flight. Set once per message from the raw
   text, because normalize has already thrown the punctuation away by the time
   the scorer sees it. */
var currentClauseBreaks = {};

function matchIntentForm(norm){
  var tokens = norm.split(' ');
  var starts = tokenOffsets(tokens);
  var negIdx = negationIndexes(tokens);
  var breaks = currentClauseBreaks;
  var best = { intent:null, score:0, length:0, suppressed:[] };
  var suppressed = [];

  for(var i = 0; i < INTENTS.length; i++){
    var def = INTENTS[i];
    var hits = [];
    var leftmost = -1;
    for(var j = 0; j < def.patterns.length; j++){
      var p = def.patterns[j];
      if(p.maxTokens && tokens.length > p.maxTokens){ continue; }
      var at = patternIndex(p, norm, tokens, starts);
      if(at === -1){ continue; }
      hits.push(p);
      if(leftmost === -1 || at < leftmost){ leftmost = at; }
    }
    if(!hits.length){ continue; }

    /* Negation is judged against where the intent first appears. That way
       "dont connect me with live agent" is suppressed by the `connect me` at
       the front, while "no update since i paid" is not, because the intent
       starts at `no update` itself rather than after the negation. */
    if(negIdx.length && isNegated(negIdx, leftmost, tokens, breaks)){ suppressed.push(def.name); continue; }

    var score = 0;
    var longest = 0;
    for(var k = 0; k < hits.length; k++){
      score += hits[k].weight;
      if(hits[k].text.length > longest){ longest = hits[k].text.length; }
    }
    if(score < MIN_SCORE){ continue; }
    if(score > best.score || (score === best.score && longest > best.length)){
      best = { intent: def.name, score: score, length: longest, suppressed: [] };
    }
  }
  best.suppressed = suppressed;
  return best;
}

/* Plain form and stemmed form are both scored; the better one wins. A typo
   corrected form is only consulted when neither found anything and nothing was
   negated, so an exact match always beats a guess and no existing input can
   change behaviour. */
function matchIntent(norm){
  var plain = matchIntentForm(norm);
  var stemmed = matchIntentForm(stem(norm));
  var winner = (stemmed.score > plain.score) ? stemmed : plain;

  if(!winner.intent && !plain.suppressed.length && !stemmed.suppressed.length){
    var corrected = fuzzyForm(norm);
    if(corrected){
      var fuzzy = matchIntentForm(corrected);
      if(fuzzy.intent){
        return { intent: fuzzy.intent, score: 1, length: fuzzy.length, suppressed: [], fuzzy: true };
      }
    }
  }

  if(!winner.suppressed.length){
    winner.suppressed = plain.suppressed.length ? plain.suppressed : stemmed.suppressed;
  }
  return winner;
}

/* Order numbers. Tolerates 111, #111, order 111, and 1 1 1. */
function extractOrderNumber(norm){
  var m = norm.match(/\d(?:[ ]?\d)*/);
  if(!m){ return null; }
  return m[0].replace(/ /g, '');
}

function isBareOrderNumber(norm){
  return /^#?\d(?:[ ]?\d)*$/.test(norm);
}

function matchOption(norm, options){
  var tokens = norm.split(' ');
  var i, j;
  /* full label first, so "cold and snowy" cannot be caught by a shorter alias */
  for(i = 0; i < options.length; i++){
    if(norm.indexOf(normalize(options[i].label)) !== -1){ return options[i].id; }
  }
  for(i = 0; i < options.length; i++){
    for(j = 0; j < options[i].aliases.length; j++){
      if(patternHits(buildPattern(options[i].aliases[j], 1), norm, tokens)){ return options[i].id; }
    }
  }
  return null;
}

function optionById(list, id){
  for(var i = 0; i < list.length; i++){ if(list[i].id === id){ return list[i]; } }
  return null;
}

function lowerFirst(s){ return s.charAt(0).toLowerCase() + s.slice(1); }

/* ============================================================
   4. STATE
   States: MENU, AWAIT_ORDER, ORDER_333_FOLLOWUP, REC_Q1,
   REC_Q2, LIVE_AGENT.
   handle() is pure with respect to the DOM. It takes a session
   plus raw user text and returns the turns to render. The UI
   and the self-test panel both call this same function.
   ============================================================ */

function createSession(){
  return {
    state: 'MENU',
    /* One counter for every way of being stuck, so misses of different kinds
       still add up. Three strikes escalates, once per stuck episode: the cap
       resets on a genuine return from LIVE_AGENT, in exitToMenu(), so a later
       stuck episode in the same session can escalate again. */
    stuckCount: 0,
    escalationUsed: false,
    agentFollowUp: false,         /* Riley asked the delivered follow-up question */
    recActivity: null,
    recCondition: null,
    awaitingAnythingElse: false,  /* the last bot message ended with "Anything else?" */
    ackIndex: -1,                 /* rotates the live agent acknowledgments */
    prefixIndex: -1,              /* rotates the live agent lookup prefixes */
    recTemplateIndex: -1          /* rotates the recommendation result templates */
  };
}

/* The closing questions the bot asks. If the last bot message ends with one of
   these, a bare yes or no from the user is an answer to it, not a fallback. */
var ANYTHING_ELSE_ENDINGS = [
  'Anything else I can help with?',
  'Anything else?',
  'Want me to help with anything else?'
];

function endsWithAnythingElse(result){
  if(!result){ return false; }
  var last = null;
  for(var i = 0; i < result.turns.length; i++){
    if(result.turns[i].role === 'bot'){ last = result.turns[i].text; }
  }
  if(!last){ return false; }
  for(var j = 0; j < ANYTHING_ELSE_ENDINGS.length; j++){
    var ending = ANYTHING_ELSE_ENDINGS[j];
    if(last.length >= ending.length && last.slice(-ending.length) === ending){ return true; }
  }
  return false;
}

function nextAgentAck(session){
  session.ackIndex = (session.ackIndex + 1) % COPY.agentAcks.length;
  return COPY.agentAcks[session.ackIndex];
}

function nextAgentPrefix(session){
  session.prefixIndex = (session.prefixIndex + 1) % COPY.agentPrefixes.length;
  return COPY.agentPrefixes[session.prefixIndex];
}

/* Riley only opens a flow the bot can finish, so a multi-turn request is handed
   back: he says so, the divider drops, and the flow's first step runs in the
   same turn with the state properly set. */
function handBackToBot(session, openingText, openingQuick, nextState){
  session.state = nextState;
  session.stuckCount = 0;
  /* This is also a genuine return from LIVE_AGENT to the bot, same as
     exitToMenu(), just mid-conversation into a slot-filling state instead of
     MENU. The escalation cap must end here too, or a user handed back this
     way can never escalate again for the rest of the session. */
  session.escalationUsed = false;
  return reply([
    bot(COPY.agentHandback, true),
    system(COPY.agentExitDivider),
    bot(openingText)
  ], openingQuick);
}

function courtesyText(norm){
  return matchList(norm, COURTESY_CLOSE) ? COPY.closingDone : COPY.courtesyThanks;
}

/* Fills whichever recommendation slots the message answers and reports where
   that leaves the flow. Used from MENU, from REC_Q1 and REC_Q2, and by Riley. */
function recAdvance(session, norm, startFresh){
  if(startFresh){
    session.recActivity = null;
    session.recCondition = null;
  }
  var activity = matchOption(norm, REC_ACTIVITIES);
  var condition = matchOption(norm, REC_CONDITIONS);
  if(activity){ session.recActivity = activity; }
  if(condition){ session.recCondition = condition; }

  if(session.recActivity && session.recCondition){
    var text = recResultText(session, session.recActivity, session.recCondition);
    session.recActivity = null;
    session.recCondition = null;
    return { text: text, state: 'MENU', quick: QUICK.menu };
  }
  if(session.recActivity){ return { text: COPY.recQ2, state: 'REC_Q2', quick: QUICK.recQ2 }; }
  return { text: COPY.recQ1, state: 'REC_Q1', quick: QUICK.recQ1 };
}

function bot(text, fromAgent){ return { role:'bot', text:text, fromAgent: !!fromAgent }; }
function system(text){ return { role:'system', text:text }; }
function reply(turns, quick){ return { turns:turns, quick:quick }; }
function prefixed(prefix, text){ return prefix ? prefix + '\n\n' + text : text; }

/* Slot filling states where a global interrupt is acknowledged. */
function isSlotFilling(state){
  return state === 'AWAIT_ORDER' || state === 'REC_Q1' || state === 'REC_Q2';
}

var STUCK_LIMIT = 3;

/* Every dead-end reply routes through here. Returns true when the user has been
   stuck long enough that the bot should stop trying and fetch a person. */
function countMiss(session){
  session.stuckCount += 1;
  return session.stuckCount >= STUCK_LIMIT && !session.escalationUsed;
}

function stuckEscalate(session){
  session.escalationUsed = true;
  return enterLiveAgent(session, [bot(COPY.stuckEscalation)]);
}

function enterLiveAgent(session, turns){
  session.state = 'LIVE_AGENT';
  session.stuckCount = 0;
  turns.push(system(COPY.agentDivider));
  turns.push(bot(COPY.agentIntro, true));
  return reply(turns, QUICK.agent);
}

function resolveOrder(session, digits, prefix){
  var record = ORDERS[digits];
  if(!record){ return invalidOrder(session, prefix); }
  session.state = record.next;
  session.stuckCount = 0;   /* resolved, so the user is no longer stuck */
  return reply([bot(prefixed(prefix, record.reply))], record.quick);
}

function invalidOrder(session, prefix){
  if(countMiss(session)){ return stuckEscalate(session); }
  session.state = 'AWAIT_ORDER';
  return reply([bot(prefixed(prefix, COPY.invalidOrderFirst))], QUICK.invalidOrder);
}

function askForDigits(session){
  if(countMiss(session)){ return stuckEscalate(session); }
  session.state = 'AWAIT_ORDER';
  return reply([bot(COPY.orderNumberPrompt)], QUICK.orderHelp);
}

/* "I don't know" in the order flow: acknowledged, but still a miss. */
function orderNumberUnknown(session){
  if(countMiss(session)){ return stuckEscalate(session); }
  session.state = 'AWAIT_ORDER';
  return reply([bot(COPY.orderNumberUnknown)], QUICK.orderHelp);
}

/* An unrecognized answer to a specific question re-asks that question and keeps
   the state, so the user never loses the flow they were halfway through. The
   second consecutive miss in the same slot escalates. */
/* A no while being asked which gear they want reads as "get me out of this",
   not as a failed answer. */
function cancelRec(session){
  session.state = 'MENU';
  session.stuckCount = 0;
  session.recActivity = null;
  session.recCondition = null;
  return reply([bot(COPY.recCancel)], QUICK.menu);
}

/* An unrecognized answer to a specific question re-asks that question and keeps
   the state, so the user never loses the flow they were halfway through. */
function slotReprompt(session, text, quick){
  if(countMiss(session)){ return stuckEscalate(session); }
  return reply([bot(text)], quick);
}

function fallback(session){
  if(countMiss(session)){ return stuckEscalate(session); }
  session.state = 'MENU';
  return reply([bot(COPY.fallbackFirst)], QUICK.menu);
}

/* Runs a matched intent. `prefix` carries the switch acknowledgement
   when the intent interrupted a slot filling state. */
function runIntent(session, intent, norm, prefix){
  session.stuckCount = 0;

  if(intent === 'LIVE_AGENT'){
    return enterLiveAgent(session, [bot(prefixed(prefix, COPY.agentConnecting))]);
  }

  if(intent === 'MENU_RESET'){
    session.state = 'MENU';
    session.stuckCount = 0;
    return reply([bot(prefixed(prefix, COPY.menuReset))], QUICK.menu);
  }

  if(intent === 'GREETING'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.greetingIntent))], QUICK.menu);
  }

  if(intent === 'COURTESY'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, courtesyText(norm)))], QUICK.menu);
  }

  if(intent === 'IDENTITY'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.identityBot))], QUICK.menu);
  }

  if(intent === 'CONTACT'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.contact))], QUICK.menu);
  }

  if(intent === 'UNAVAILABLE'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.unavailable))], QUICK.menu);
  }

  /* Uses the identity copy, not the menu reset copy: opening with "Back to the
     main menu" at someone who said "i dont understand" is the same incoherent
     announcement problem as the switch-gears prefix. Same capability list. */
  if(intent === 'CAPABILITY'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.identityBot))], QUICK.menu);
  }

  if(intent === 'UNSUPPORTED'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.unsupportedAction))], QUICK.menu);
  }


  if(intent === 'ORDER_TRACKING'){
    session.stuckCount = 0;
    var digits = extractOrderNumber(norm);
    /* The number is already in the message, so do not ask for it again. */
    if(digits){ return resolveOrder(session, digits, prefix); }
    session.state = 'AWAIT_ORDER';
    return reply([bot(prefixed(prefix, COPY.askOrder))], QUICK.none);
  }

  if(intent === 'RETURNS'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.returns))], QUICK.menu);
  }

  if(intent === 'SHIPPING'){
    session.state = 'MENU';
    return reply([bot(prefixed(prefix, COPY.shipping))], QUICK.menu);
  }

  /* The message may already name an activity or a condition, for instance when
     the user types a quick reply label straight from the menu. Fill that slot
     and skip the question rather than asking something already answered. */
  if(intent === 'PRODUCT_REC'){
    var step = recAdvance(session, norm, true);
    session.state = step.state;
    /* a catalog question gets an answer before it gets a question back */
    var recText = matchList(norm, CATALOG) ? COPY.catalogIntro + '\n\n' + step.text : step.text;
    return reply([bot(prefixed(prefix, recText))], step.quick);
  }

  return fallback(session);
}

/* Riley. Answers with the bot's own factual copy, so the provided data is word
   for word identical, and never repeats an acknowledgment twice in a row. */
function exitToMenu(session){
  session.state = 'MENU';
  session.stuckCount = 0;
  /* The escalation cap is once per stuck episode, not once per session. A
     genuine return to the bot ends that episode, so a later run of misses can
     escalate again rather than repeating the fallback response forever. */
  session.escalationUsed = false;
  return reply([system(COPY.agentExitDivider), bot(COPY.agentExit)], QUICK.menu);
}

function liveAgentTurn(session, norm){
  var match = matchIntent(norm);
  var tokens = norm.split(' ');

  /* Asked directly, say what this is. These run before everything else because
     "are you a bot" mentions the bot without asking to be sent back to it, and
     "when will i hear back" ends in the navigation word `back`. */
  if(matchList(norm, AGENT_IDENTITY)){ return reply([bot(COPY.agentIdentity, true)], QUICK.agent); }
  if(matchList(norm, AGENT_TIMING)){ return reply([bot(COPY.agentTiming, true)], QUICK.agent); }

  /* Getting back to the bot needs an actual request to be moved. Mentioning the
     bot is not one: "you are acting like a bot" is a complaint. */
  var mentionsBot = tokens.indexOf('bot') !== -1 || tokens.indexOf('chatbot') !== -1 ||
                    matchList(norm, RETURN_TO_BOT);
  /* "why did the bot transfer me" narrates a past transfer, it does not ask for
     one. An interrogative opener plus a past auxiliary is a question. */
  var narrating = /^(why|what|when|who|how)\b/.test(norm) && /\b(did|was|were|has|have)\b/.test(norm);
  if(mentionsBot && matchList(norm, MOVEMENT) && !narrating){ return exitToMenu(session); }

  /* Riley asked the 333 follow-up, so Riley handles the answer. */
  if(session.agentFollowUp){
    if(matchShortList(norm, DENY)){
      session.agentFollowUp = false;
      return reply([bot(COPY.followUpNo, true)], QUICK.agent);
    }
    if(matchShortList(norm, AFFIRM)){
      session.agentFollowUp = false;
      return reply([bot(COPY.agentFollowUpYes, true)], QUICK.agent);
    }
    session.agentFollowUp = false;
  }

  /* A known order number anywhere in the message, ahead of yes, no and thanks. */
  var agentOrder = standaloneOrderToken(norm);
  if(agentOrder){
    session.agentFollowUp = (agentOrder === '333');
    return reply([bot(prefixed(nextAgentPrefix(session), ORDERS[agentOrder].reply), true)], QUICK.agent);
  }

  if(match.intent === 'MENU_RESET'){ return exitToMenu(session); }

  /* Only when they actually asked to be transferred. "who all are there in your
     team" mentions the team but is a question, not a transfer request. */
  if(match.intent === 'LIVE_AGENT' && matchList(norm, TRANSFER_REQUEST)){
    return reply([bot(COPY.agentAlready, true)], QUICK.agent);
  }

  if(match.intent === 'CAPABILITY'){ return reply([bot(COPY.agentCapability, true)], QUICK.agent); }
  if(match.intent === 'GREETING'){ return reply([bot(COPY.agentGreeting, true)], QUICK.agent); }

  /* direct answers, no lookup prefix */
  if(match.intent === 'IDENTITY'){ return reply([bot(COPY.identityAgent, true)], QUICK.agent); }
  if(match.intent === 'CONTACT'){ return reply([bot(COPY.contact, true)], QUICK.agent); }
  if(match.intent === 'UNAVAILABLE'){ return reply([bot(COPY.unavailable, true)], QUICK.agent); }

  /* Riley's factual answers end with "Anything else?", so a bare yes or no is an
     answer to that question and not something to file away unanswered. */
  if(session.awaitingAnythingElse){
    var agentClosing = matchShortList(norm, CLOSING_DENY) ? 'deny'
                     : (matchShortList(norm, CLOSING_AFFIRM) ? 'affirm' : null);
    if(agentClosing){
      var alsoMatched = matchIntent(norm);
      if(!alsoMatched.intent || alsoMatched.intent === 'COURTESY'){
        return reply([bot(agentClosing === 'deny' ? COPY.agentClosing : nextAgentAck(session), true)], QUICK.agent);
      }
    }
  }

  if(match.intent === 'COURTESY'){ return reply([bot(courtesyText(norm), true)], QUICK.agent); }

  /* ---- Group A, single shot. Riley answers with the bot's own copy. ---- */
  if(match.intent === 'RETURNS'){ return reply([bot(prefixed(nextAgentPrefix(session), COPY.returns), true)], QUICK.agent); }
  if(match.intent === 'SHIPPING'){ return reply([bot(prefixed(nextAgentPrefix(session), COPY.shipping), true)], QUICK.agent); }

  if(match.intent === 'ORDER_TRACKING'){
    var digits = extractOrderNumber(norm);
    if(digits){
      return ORDERS[digits]
        ? reply([bot(prefixed(nextAgentPrefix(session), ORDERS[digits].reply), true)], QUICK.agent)
        : reply([bot(COPY.agentUnknownOrder, true)], QUICK.agent);
    }
    /* ---- Group B, multi turn. No number to work with, so hand the slot
            filling back to the bot rather than asking a question Riley
            cannot process the answer to. ---- */
    session.stuckCount = 0;
    return handBackToBot(session, COPY.askOrder, QUICK.none, 'AWAIT_ORDER');
  }

  /* ---- Group B, multi turn ---- */
  if(match.intent === 'PRODUCT_REC'){
    var recStep = recAdvance(session, norm, true);
    var opening = matchList(norm, CATALOG) ? COPY.catalogIntro + '\n\n' + recStep.text : recStep.text;
    return handBackToBot(session, opening, recStep.quick, recStep.state);
  }

  /* A number typed to the agent is an order number, so answer it either way
     rather than filing it as a note. */
  if(isBareOrderNumber(norm)){
    var bare = ORDERS[extractOrderNumber(norm)];
    return bare
      ? reply([bot(prefixed(nextAgentPrefix(session), bare.reply), true)], QUICK.agent)
      : reply([bot(COPY.agentUnknownOrder, true)], QUICK.agent);
  }

  return reply([bot(nextAgentAck(session), true)], QUICK.agent);
}

function menuResetReply(session, prefix){
  session.state = 'MENU';
  session.stuckCount = 0;
  return reply([bot(prefixed(prefix, COPY.menuReset))], QUICK.menu);
}

/* One entry point for the global matcher, used from every state. Returns null
   when nothing applied, leaving the caller to run its own fallback.
   Order matters: a real intent wins, then an explicit cancel, then a negation
   that suppressed something, so "nevermind, i want to buy gears" still buys
   gear and "dont connect me with a live agent" does not connect anyone. */
/* "Sure, let's switch gears." belongs on a genuine mid-flow pivot only. Never on
   a cancel, a courtesy, a frustration escalation, an offered chip, or anything
   typed from the menu. */
var PREFIXABLE_INTENTS = ['ORDER_TRACKING', 'RETURNS', 'SHIPPING', 'PRODUCT_REC', 'MENU_RESET', 'LIVE_AGENT'];
var OFFERED_CHIPS = ['back to main menu', 'try again', 'talk to a live agent'];

function switchPrefixFor(intent, norm, prefix){
  if(!prefix){ return null; }
  if(PREFIXABLE_INTENTS.indexOf(intent) === -1){ return null; }
  if(OFFERED_CHIPS.indexOf(norm) !== -1){ return null; }
  return prefix;
}

function globalTurn(session, norm, prefix){
  /* Settle the sense of "order" before routing, so a purchase is never treated
     as a lookup and nobody is asked for a number they do not have. */
  var sense = orderSense(norm);
  if(sense === 'purchase'){
    return runIntent(session, 'PRODUCT_REC', norm, switchPrefixFor('PRODUCT_REC', norm, prefix));
  }
  if(sense === 'ask'){
    /* A clarifying question with chips is progress, like the gear questions, so
       it is not a miss. It does not reset the counter either: asking the same
       thing repeatedly must still be able to reach escalation. */
    session.state = 'MENU';
    return reply([bot(COPY.orderSenseQuestion)], QUICK.orderSense);
  }

  var match = matchIntent(norm);
  if(match.intent){
    return runIntent(session, match.intent, norm, switchPrefixFor(match.intent, norm, prefix));
  }

  if(matchList(norm, NEVERMIND)){ return menuResetReply(session, null); }

  /* A known order number sitting in the message is a real request even when the
     wording matched nothing, as in "terrible service, when will 111 arrive". */
  var loose = extractOrderNumber(norm);
  if(loose && ORDERS[loose]){ return resolveOrder(session, loose, null); }

  if(match.suppressed.length){
    var wasAgent = match.suppressed.indexOf('LIVE_AGENT') !== -1;
    /* "I'll keep you here with the support bot" is what the user asked for, so
       it resolves. "What would you like to do instead?" answers nothing, so it
       is a miss and counts toward escalation like any other dead end. */
    if(wasAgent){
      session.state = 'MENU';
      session.stuckCount = 0;
      return reply([bot(COPY.negatedAgent)], QUICK.menu);
    }
    if(countMiss(session)){ return stuckEscalate(session); }
    session.state = 'MENU';
    return reply([bot(COPY.negatedOther)], QUICK.menu);
  }

  /* Last resort only. Nothing the user asked for was recognized, and they are
     clearly annoyed, so hand them to a person. No prefix, no lecture. */
  if(matchList(norm, FRUSTRATION)){
    return enterLiveAgent(session, [bot(COPY.frustration)]);
  }

  return null;
}

function route(session, norm){

  /* ---- LIVE_AGENT ---- */
  if(session.state === 'LIVE_AGENT'){ return liveAgentTurn(session, norm); }

  /* A known order number anywhere in the message is a lookup, in any state and
     ahead of yes, no and thanks. "no sorry 111" is a correction, not a goodbye. */
  if(session.state !== 'AWAIT_ORDER'){
    var known = standaloneOrderToken(norm);
    if(known){
      session.stuckCount = 0;
      return resolveOrder(session, known, null);
    }
  }

  /* ---- ORDER_333_FOLLOWUP: contextual yes and no first. This sits above the
          closing question handling further down, so "no" here stays a delivery
          problem and never becomes an answer to "Anything else?" ---- */
  if(session.state === 'ORDER_333_FOLLOWUP'){
    /* an explicit request to return is a no, however long the sentence */
    if(matchList(norm, FOLLOWUP_RETURN)){
      session.state = 'MENU';
      session.stuckCount = 0;
      return reply([bot(COPY.followUpNo)], QUICK.menu);
    }
    if(matchShortList(norm, DENY)){
      session.state = 'MENU';
      session.stuckCount = 0;
      return reply([bot(COPY.followUpNo)], QUICK.menu);
    }
    if(matchShortList(norm, AFFIRM)){
      session.state = 'MENU';
      session.stuckCount = 0;
      return reply([bot(COPY.followUpYes)], QUICK.menu);
    }
    /* a global interrupt still wins, but an unrecognized answer re-asks */
    var followUpTurn = globalTurn(session, norm, null);
    if(followUpTurn){ return followUpTurn; }
    return slotReprompt(session, COPY.followUpReprompt, QUICK.delivered);
  }

  /* ---- AWAIT_ORDER: slot filling. Digits are a lookup. No digits is not a
          failed lookup, so it goes to the global matcher and, failing that,
          to a re-prompt, and every miss feeds the shared stuck counter ---- */
  if(session.state === 'AWAIT_ORDER'){
    var digits = extractOrderNumber(norm);
    if(digits){ return resolveOrder(session, digits, null); }
    /* Not knowing the number is an answer worth acknowledging, but it does not
       move the lookup forward, so it still counts toward being stuck. */
    if(matchList(norm, ORDER_UNSURE)){ return orderNumberUnknown(session); }
    /* Talking about the order without giving a number is not a flow switch, so
       re-prompt plainly instead of announcing a switch to the flow we are in. */
    if(matchIntent(norm).intent === 'ORDER_TRACKING'){ return askForDigits(session); }
    var awaitTurn = globalTurn(session, norm, COPY.switchAck);
    if(awaitTurn){ return awaitTurn; }
    return askForDigits(session);
  }

  /* ---- REC_Q1 ---- */
  if(session.state === 'REC_Q1'){
    if(matchOption(norm, REC_ACTIVITIES)){
      var step1 = recAdvance(session, norm, false);
      session.state = step1.state;
      session.stuckCount = 0;
      return reply([bot(step1.text)], step1.quick);
    }
    /* an activity we do not carry gear for is answered honestly, not forced */
    if(matchList(norm, REC_OUT_OF_SCOPE)){ return reply([bot(COPY.recOutOfScope)], QUICK.recQ1); }
    /* "not sure" is an answer, not a miss, and does not count against the streak */
    if(matchList(norm, REC_UNSURE)){ return reply([bot(COPY.recUnsureQ1)], QUICK.recQ1); }
    /* the global matcher runs before the cancel check, so "wrong size" here is
       still a returns question rather than a way out of the flow */
    var q1Turn = globalTurn(session, norm, COPY.switchAck);
    if(q1Turn){ return q1Turn; }
    if(matchShortList(norm, DENY) || matchShortList(norm, REC_CANCEL)){ return cancelRec(session); }
    return slotReprompt(session, COPY.recReprompt, QUICK.recQ1);
  }

  /* ---- REC_Q2 ---- */
  if(session.state === 'REC_Q2'){
    if(matchOption(norm, REC_CONDITIONS)){
      var step2 = recAdvance(session, norm, false);
      session.state = step2.state;
      session.stuckCount = 0;
      return reply([bot(step2.text)], step2.quick);
    }
    if(matchList(norm, REC_UNSURE)){ return reply([bot(COPY.recUnsureQ2)], QUICK.recQ2); }
    var q2Turn = globalTurn(session, norm, COPY.switchAck);
    if(q2Turn){ return q2Turn; }
    if(matchShortList(norm, DENY) || matchShortList(norm, REC_CANCEL)){ return cancelRec(session); }
    return slotReprompt(session, COPY.recReprompt, QUICK.recQ2);
  }

  /* ---- answering the bot's own closing question ---- */
  if(session.state === 'MENU' && session.awaitingAnythingElse){
    var closing = matchShortList(norm, CLOSING_DENY) ? 'deny'
                : (matchShortList(norm, CLOSING_AFFIRM) ? 'affirm' : null);
    if(closing){
      var alongside = matchIntent(norm);
      /* "no thanks" is still a no. "no, where is my order" is an order question. */
      if(!alongside.intent || alongside.intent === 'COURTESY'){
        session.stuckCount = 0;
        return reply([bot(closing === 'deny' ? COPY.closingDone : COPY.closingMore)], QUICK.menu);
      }
    }
  }

  /* ---- MENU, and the fall through from ORDER_333_FOLLOWUP ---- */
  var prefix = isSlotFilling(session.state) ? COPY.switchAck : null;
  var menuTurn = globalTurn(session, norm, prefix);
  if(menuTurn){ return menuTurn; }

  /* A bare number at the menu routes straight into order tracking. */
  if(isBareOrderNumber(norm)){
    session.stuckCount = 0;
    return resolveOrder(session, extractOrderNumber(norm), null);
  }

  return fallback(session);
}

/* fallback() always resets to MENU, which is only correct for a bot-controlled
   state. LIVE_AGENT has its own "I didn't get that" shape, Riley's rotating
   redirect, that never touches state or the header and never re-runs the
   connect sequence, because the user never left the handoff. Every call site
   that can fire before intent matching even runs, ahead of the state-specific
   routing that would otherwise make this distinction, must go through here
   instead of calling fallback() directly. */
function unrecognizedInput(session){
  if(session.state === 'LIVE_AGENT'){
    return reply([bot(nextAgentAck(session), true)], QUICK.agent);
  }
  return fallback(session);
}

function handle(session, raw){
  /* Empty or whitespace only input is never sent. */
  if(!raw || !String(raw).replace(/\s/g, '')){ return null; }

  /* Junk tokens are checked before anything else in the pipeline, ahead of
     intent matching and regardless of state, so "where is my <abc>" never
     reaches AWAIT_ORDER as if no number had been given. A real wrong number
     like 999 still goes through the normal invalid-order path; this is only
     for symbol-junk that was never a plausible number to begin with. */
  if(hasJunkToken(raw)){
    var junkResult = unrecognizedInput(session);
    session.awaitingAnythingElse = endsWithAnythingElse(junkResult);
    return junkResult;
  }

  currentClauseBreaks = clauseBreaks(raw);
  var norm = normalize(raw);

  /* Same treatment as a junk token: "where is my abc" reads as an
     order-tracking request with a placeholder object, not a real one, so it
     never reaches AWAIT_ORDER as if no number had been given. */
  if(norm && isOrderTrackingPlaceholder(norm)){
    var placeholderResult = unrecognizedInput(session);
    session.awaitingAnythingElse = endsWithAnythingElse(placeholderResult);
    return placeholderResult;
  }

  var result = norm ? route(session, norm) : unrecognizedInput(session);

  /* Remember whether the bot just asked "Anything else?", so a bare yes or no
     on the next turn is read as an answer instead of an unrecognized input. */
  session.awaitingAnythingElse = endsWithAnythingElse(result);
  return result;
}

   5. RENDER
   ============================================================ */

var TYPING_MS = 600;
var STEP_MS = 140;
var DIVIDER_MS = 320;

var elTranscript, elQuick, elInput, elSend, elComposer, elHdr, elTitle, elStatusText, elPanel, elSummary, elCases, elToggle;
var session = createSession();
var busy = false;

function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatBotText(text){
  var safe = esc(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return safe.split('\n\n').map(function(block){
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function stamp(){
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();
  var suffix = h < 12 ? 'AM' : 'PM';
  var hour = h % 12;
  if(hour === 0){ hour = 12; }
  return hour + ':' + (m < 10 ? '0' : '') + m + ' ' + suffix;
}

function scrollDown(){ elTranscript.scrollTop = elTranscript.scrollHeight; }

function addMessage(role, text, fromAgent){
  var row = document.createElement('div');
  row.className = 'row ' + role;

  var bubble = document.createElement('div');
  bubble.className = 'bubble' + (fromAgent ? ' from-agent' : '');
  if(role === 'user'){
    bubble.textContent = text;
  } else {
    bubble.innerHTML = formatBotText(text);
  }

  var time = document.createElement('div');
  time.className = 'stamp';
  time.textContent = (role === 'user' ? 'You ' : (fromAgent ? 'Riley ' : 'Bot ')) + stamp();

  row.appendChild(bubble);
  row.appendChild(time);
  elTranscript.appendChild(row);
  scrollDown();
}

function addSystem(text){
  var row = document.createElement('div');
  row.className = 'sys' + (text === COPY.agentDivider ? ' hot' : '');
  row.textContent = text;
  elTranscript.appendChild(row);
  scrollDown();
}

function showTyping(){
  var row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  row.setAttribute('aria-hidden', 'true');
  var bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.appendChild(document.createElement('span'));
  bubble.appendChild(document.createElement('span'));
  bubble.appendChild(document.createElement('span'));
  row.appendChild(bubble);
  elTranscript.appendChild(row);
  scrollDown();
}

function hideTyping(){
  var row = document.getElementById('typingRow');
  if(row && row.parentNode){ row.parentNode.removeChild(row); }
}

function setAgentMode(on){
  /* the whole surface signals the state, not just the header */
  var app = document.querySelector('.app');
  if(app){ app.classList.toggle('agent-mode', !!on); }
  if(on){
    elHdr.classList.add('agent');
    elTitle.textContent = 'Riley · Live Agent';
    elStatusText.textContent = 'connected';
  } else {
    elHdr.classList.remove('agent');
    elTitle.textContent = 'North Star Support Bot';
    elStatusText.textContent = 'Automated support';
  }
}

function setQuick(labels){
  elQuick.innerHTML = '';
  elQuick.className = 'quick count-' + labels.length;
  for(var i = 0; i < labels.length; i++){
    (function(label){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = label;
      chip.setAttribute('aria-label', label);
      chip.addEventListener('click', function(){
        if(busy){ return; }
        elQuick.innerHTML = '';   /* chips disappear once used */
        send(label);
      });
      elQuick.appendChild(chip);
    }(labels[i]));
  }
}

function setBusy(state){
  busy = state;
  elSend.disabled = state;
}

function playTurns(result){
  setBusy(true);
  setQuick([]);
  var index = 0;

  function step(){
    if(index >= result.turns.length){
      setBusy(false);
      setQuick(result.quick);
      scrollDown();   /* chips shrink the transcript, so scroll again after they mount */
      elInput.focus();
      return;
    }
    var turn = result.turns[index++];

    if(turn.role === 'system'){
      if(turn.text === COPY.agentDivider){ setAgentMode(true); }
      if(turn.text === COPY.agentExitDivider){ setAgentMode(false); }
      addSystem(turn.text);
      window.setTimeout(step, DIVIDER_MS);
      return;
    }

    showTyping();
    window.setTimeout(function(){
      hideTyping();
      addMessage('bot', turn.text, turn.fromAgent);
      window.setTimeout(step, STEP_MS);
    }, TYPING_MS);
  }

  step();
}

function send(raw){
  if(busy){ return; }
  var text = String(raw).replace(/^\s+|\s+$/g, '');
  if(!text){ elInput.focus(); return; }   /* empty input is ignored silently */

  addMessage('user', text, false);
  elInput.value = '';

  var result = handle(session, text);
  if(!result){ elInput.focus(); return; }
  playTurns(result);
}

/* ============================================================
   6. SELFTEST
   Every case below runs through handle(), the same function the
   chat window uses. Nothing here is stubbed or hardcoded.
   ============================================================ */

function drive(messages){
  var s = createSession();
  var last = null;
  for(var i = 0; i < messages.length; i++){ last = handle(s, messages[i]); }
  return { session: s, result: last, text: turnsText(last) };
}

/* Same as drive, but keeps every reply, so repetition can be checked. */
function driveCollect(messages){
  var s = createSession();
  var texts = [];
  for(var i = 0; i < messages.length; i++){ texts.push(turnsText(handle(s, messages[i]))); }
  return { session: s, texts: texts };
}

function turnsText(result){
  if(!result){ return ''; }
  var parts = [];
  for(var i = 0; i < result.turns.length; i++){
    var t = result.turns[i];
    parts.push(t.role === 'system' ? '[' + t.text + ']' : t.text);
  }
  return parts.join('\n');
}

function has(text, needle){
  return text.toLowerCase().indexOf(String(needle).toLowerCase()) !== -1;
}

function hasAll(text, needles){
  for(var i = 0; i < needles.length; i++){
    if(!has(text, needles[i])){ return false; }
  }
  return true;
}

function oneLine(text){
  return text.replace(/\n+/g, ' / ');
}

function runSelfTest(){
  var results = [];
  var passed = 0;
  for(var i = 0; i < TEST_CASES.length; i++){
    var c = TEST_CASES[i];
    var outcome;
    try {
      outcome = c.run();
    } catch(err){
      outcome = { ok:false, got:{ session:{ state:'error' }, text:String(err && err.message ? err.message : err) } };
    }
    if(outcome.ok){ passed += 1; }
    results.push({
      number: i + 1,
      input: c.input,
      from: c.from,
      expect: c.expect,
      ok: outcome.ok,
      state: outcome.got.session.state,
      output: outcome.got.text
    });
  }
  return { total: TEST_CASES.length, passed: passed, results: results };
}

function renderSelfTest(){
  var report = runSelfTest();
  elSummary.textContent = report.passed + ' of ' + report.total + ' checks passed';
  elCases.innerHTML = '';
  for(var i = 0; i < report.results.length; i++){
    var r = report.results[i];
    var li = document.createElement('li');
    li.className = 'case ' + (r.ok ? 'pass' : 'fail');

    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = r.ok ? 'PASS' : 'FAIL';

    var body = document.createElement('span');
    var head = document.createElement('span');
    head.innerHTML = r.number + '. <code>' + esc(r.input) + '</code> from ' + esc(r.from);
    var meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = 'Expected: ' + r.expect + '. Got: state ' + r.state + '. ' + oneLine(r.output);

    body.appendChild(head);
    body.appendChild(meta);
    li.appendChild(badge);
    li.appendChild(body);
    elCases.appendChild(li);
  }
}

function boot(){
  elTranscript = document.getElementById('transcript');
  elQuick = document.getElementById('quick');
  elInput = document.getElementById('input');
  elSend = document.getElementById('send');
  elComposer = document.getElementById('composer');
  elHdr = document.getElementById('hdr');
  elTitle = document.getElementById('hdrTitle');
  elStatusText = document.getElementById('hdrStatusText');
  elPanel = document.getElementById('panel');
  elSummary = document.getElementById('summary');
  elCases = document.getElementById('cases');
  elToggle = document.getElementById('selftestToggle');

  elComposer.addEventListener('submit', function(e){
    e.preventDefault();
    send(elInput.value);
  });

  /* Enter sends. Handled explicitly rather than relying on implicit form
     submission, which some embedded browser views do not trigger. */
  elInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send(elInput.value);
    }
  });

  elToggle.addEventListener('click', function(){
    var open = elPanel.hasAttribute('hidden');
    if(open){
      renderSelfTest();
      elPanel.removeAttribute('hidden');
      elPanel.scrollTop = 0;   /* always open on the summary line */
      elToggle.textContent = 'Hide self-test';
      elToggle.setAttribute('aria-expanded', 'true');
    } else {
      elPanel.setAttribute('hidden', '');
      elToggle.textContent = 'Run self-test';
      elToggle.setAttribute('aria-expanded', 'false');
    }
  });

  /* Present before it speaks. Skipped entirely when motion is reduced, and the
     engine is untouched either way, so headless runs are unaffected. */
  var stillMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(stillMotion){
    addMessage('bot', COPY.greeting, false);
    setQuick(QUICK.menu);
  } else {
    setBusy(true);
    showTyping();
    window.setTimeout(function(){
      hideTyping();
      addMessage('bot', COPY.greeting, false);
      setBusy(false);
      setQuick(QUICK.menu);
      scrollDown();
      elInput.focus();
    }, 700);
  }
  elInput.focus();
}

if(typeof document !== 'undefined'){ boot(); }

/* Exposed so the conversation engine can be exercised outside the
   browser during development. The page itself never reads this. */
(typeof window !== 'undefined' ? window : globalThis).NORTH_STAR = {
  COPY: COPY,
  ORDERS: ORDERS,
  createSession: createSession,
  handle: handle,
  normalize: normalize,
  matchIntent: matchIntent,
  /* matches against raw text, so clause boundaries are taken into account */
  intentOf: function(raw){ currentClauseBreaks = clauseBreaks(raw); return matchIntent(normalize(raw)); },
  runSelfTest: runSelfTest
};

}());
